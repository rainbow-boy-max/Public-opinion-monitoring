packages:
  - 'backend'
  - 'frontend-admin'
  - 'frontend-user'
  - 'frontend-shared'
allowBuilds:
  '@alicloud/openapi-core': true
  '@nestjs/core': true
  '@parcel/watcher': set this to true or false
  bcrypt: true
  better-sqlite3: set this to true or false
  esbuild: true
  msgpackr-extract: true
  puppeteer: set this to true or false
  vue-demi: true
